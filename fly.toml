# fly.toml - Fly.io configuration
# Run `fly launch` to generate your app name, then update this file

app = "bookconsignment"  # Change this to your app name after `fly launch`
primary_region = "dfw"   # Dallas - change to your preferred region

[build]

[env]
  PORT = "8080"
  DJANGO_SETTINGS_MODULE = "config.settings"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/admin/login/"
    interval = "30s"
    timeout = "5s"
