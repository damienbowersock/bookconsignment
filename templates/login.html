{% extends "base.html" %}
{% block title %}Login - Consignify{% endblock %}
{% block content %}
<div class="mx-auto max-w-md bg-white rounded-lg shadow p-6 mt-10">
  <h1 class="text-xl font-semibold mb-4">Sign in</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm text-gray-700">Username</label>
      <input type="text" name="username" class="mt-1 w-full border rounded px-3 py-2" required />
    </div>
    <div>
      <label class="block text-sm text-gray-700">Password</label>
      <input type="password" name="password" class="mt-1 w-full border rounded px-3 py-2" required />
    </div>
    <button class="w-full bg-blue-600 text-white rounded px-3 py-2">Login</button>
  </form>
</div>
{% endblock %}
